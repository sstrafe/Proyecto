<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="ISO-8859-1">
    <title>Spring Boot</title>
    <link rel="stylesheet"
          href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
          integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
          crossorigin="anonymous">
</head>
<body>
<nav class="navbar navbar-expand-md bg-dark navbar-dark">
    <a class="navbar-brand">Ventas de Don Pepe</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#collapsibleNavbar">
        <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="collapsibleNavbar">
        <ul class="navbar-nav">
            <li class="nav-item">
                <a class="nav-link" th:href="@{/administrador/usuario}">Administrar Usuario</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/administrador/cliente}">Mantener Cliente</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/administrador/producto}">Administrar Producto</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/administrador/proveedor}">Administrar Proveedor</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/administrador/venta}">Mantener Venta</a>
            </li>
        </ul>
    </div>
</nav>

<div class="container">
    <div class="row mt-3">
        <h1>Lista Productos</h1>
    </div>

    <div class="row">
        <div class="col-lg-3">
            <a th:href="@{/administrador/producto/new}" class="btn btn-primary btn-sm mb-3">Agregar Producto</a>
        </div>
    </div>

    <table class="table table-striped table-bordered">
        <thead class="table-dark">
        <tr>
            <th>Id</th>
            <th>Codigo</th>
            <th>Descripcion</th>
            <th>PrecioCompra</th>
            <th>PrecioVenta</th>
            <th>Stock</th>
            <th>Categoria</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="producto: ${productos}">
            <td th:text="${producto.idProd}"></td>
            <td th:text="${producto.codigo}"></td>
            <td th:text="${producto.descripcion}"></td>
            <td th:text="${producto.precioCompra}"></td>
            <td th:text="${producto.precioVenta}"></td>
            <td th:text="${producto.stock}"></td>
            <td th:text="${producto.categoria.descripcion}"></td>
            <td>
				<a th:href="@{/administrador/producto/edit/{id}(id=${producto.idProd})}" class="btn btn-primary">Editar</a>
				<a th:href="@{/administrador/producto/delete/{id}(id=${producto.idProd})}" class="btn btn-danger">Eliminar</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
