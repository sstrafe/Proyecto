<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrar Producto</title>
    <link rel="stylesheet"
          href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
          integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
          crossorigin="anonymous">
</head>
<body>
<nav class="navbar navbar-expand-md bg-dark navbar-dark">
    <a class="navbar-brand" href="#">Ventas de Don Pepe</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#collapsibleNavbar">
        <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="collapsibleNavbar">
        <ul class="navbar-nav">
            <li class="nav-item">
                <a class="nav-link" th:href="@{/administrador/usuario}">Administrar Usuario</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/administrador/cliente}">Mantener Cliente</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/administrador/producto}">Administrar Producto</a>
            </li>
			<li class="nav-item">
			       <a class="nav-link" th:href="@{/administrador/proveedor}">Administrar Proveedor</a>
			   </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/administrador/venta}">Mantener Venta</a>
            </li>
        </ul>
    </div>
</nav>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8 col-sm-10">
            <div class="card">
                <h4 class="card-header text-center">Crear Nuevo Producto</h4>
                <div class="card-body">
					<form th:action="@{/administrador/producto/guardar}" th:object="${producto}" method="POST">
                        <input type="hidden" th:field="*{idProd}" />

                        <div class="form-group">
                            <label>Codigo</label>
                            <input type="text" th:field="*{codigo}" class="form-control" placeholder="Ej. P001" required />
                        </div>

                        <div class="form-group">
                            <label>Descripción</label>
                            <input type="text" th:field="*{descripcion}" class="form-control" placeholder="Descripción del producto" required />
                        </div>

                        <div class="form-group">
                            <label>Precio Compra</label>
                            <input type="number" step="0.01" th:field="*{precioCompra}" class="form-control" required />
                        </div>

                        <div class="form-group">
                            <label>Precio Venta</label>
                            <input type="number" step="0.01" th:field="*{precioVenta}" class="form-control" required />
                        </div>

                        <div class="form-group">
                            <label>Stock</label>
                            <input type="number" th:field="*{stock}" class="form-control" required />
                        </div>

                        <div class="form-group">
                            <label>Categoría</label>
                            <select th:field="*{categoria}" class="form-control" required>
                                <option value="">-- Selecciona una categoría --</option>
                                <option th:each="categoria : ${categoriaList}"
                                        th:value="${categoria}"
                                        th:text="${categoria.descripcion}">
                                </option>
                            </select>
                        </div>

                        <div class="text-center">
                            <button type="submit" class="btn btn-primary">Guardar</button>
                            <a th:href="@{/administrador/producto}" class="btn btn-secondary ml-2">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
