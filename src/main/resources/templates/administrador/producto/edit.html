<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="ISO-8859-1">
    <title>Spring Boot</title>
    <link rel="stylesheet"
          href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
          integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
          crossorigin="anonymous">
</head>
<body>
<nav class="navbar navbar-expand-md bg-dark navbar-dark">
    <a class="navbar-brand" href="#">Sistema de Ventas</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#collapsibleNavbar">
        <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="collapsibleNavbar">
        <ul class="navbar-nav">
            <li class="nav-item">
                <a class="nav-link" th:href="@{/usuario}">Mantenedor Usuario</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/cliente}">Mantenedor Cliente</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/producto}">Mantenedor Producto</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/venta}">Mantenedor Venta</a>
            </li>
        </ul>
    </div>
</nav>

<div class="container mt-3">
    <div class="row">
        <div class="col-lg-6 col-md-6 col-sm-6 container justify-content-center card">
            <h1 class="text-center">Editar Producto</h1>
            <div class="card-body">
				<form th:action="@{/administrador/producto/{id}(id=${producto.idProd})}" th:object="${producto}" method="POST">

                    <div class="form-group" style="display: none">
                        <label>Id</label>
                        <input type="text" th:field="*{idProd}" class="form-control" placeholder="ID" />
                    </div>

                    <div class="form-group">
                        <label>Código</label>
                        <input type="text" th:field="*{codigo}" class="form-control" placeholder="Código del producto" />
                    </div>

                    <div class="form-group">
                        <label>Descripción</label>
                        <input type="text" th:field="*{descripcion}" class="form-control" placeholder="Descripción" />
                    </div>

                    <div class="form-group">
                        <label>Precio Compra</label>
                        <input type="number" step="0.01" th:field="*{precioCompra}" class="form-control" placeholder="Precio de compra" />
                    </div>

                    <div class="form-group">
                        <label>Precio Venta</label>
                        <input type="number" step="0.01" th:field="*{precioVenta}" class="form-control" placeholder="Precio de venta" />
                    </div>

                    <div class="form-group">
                        <label>Stock</label>
                        <input type="number" th:field="*{stock}" class="form-control" placeholder="Cantidad en stock" />
                    </div>

                    <div class="form-group">
                        <label>Categoría</label>
                        <select th:field="*{categoria}" class="form-control">
                            <option th:each="categoria : ${categoriaList}"
                                    th:value="${categoria}"
                                    th:text="${categoria.descripcion}">
                            </option>
                        </select>
                    </div>

                    <div class="box-footer">
                        <button type="submit" class="btn btn-primary">Actualizar</button>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
