<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Proveedor</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
          integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
          crossorigin="anonymous">
</head>
<body>
<nav class="navbar navbar-expand-md bg-dark navbar-dark">
    <a class="navbar-brand">Ventas de Don Pepe</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#collapsibleNavbar">
        <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="collapsibleNavbar">
        <ul class="navbar-nav">
            <li class="nav-item"><a class="nav-link" th:href="@{/usuario}">Administrar Usuario</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/cliente}">Mantener Cliente</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/producto}">Administrar Producto</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/administrador/proveedor}">Administrar Proveedor</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/venta}">Generar Reportes</a></li>
        </ul>
    </div>
</nav>

<div class="container mt-4">
    <h2>Editar Proveedor</h2>
    <form th:action="@{/administrador/proveedor/update/{id}(id=${proveedor.idprov})}" th:object="${proveedor}" method="POST">
        <input type="hidden" th:field="*{idprov}" />
        <div class="form-group">
            <label>Nombre</label>
            <input type="text" th:field="*{nomprov}" class="form-control" required />
        </div>
        <div class="form-group">
            <label>Teléfono</label>
            <input type="text" th:field="*{tfnprov}" class="form-control" required />
        </div>
        <div class="form-group">
            <label>Dirección</label>
            <input type="text" th:field="*{dirprov}" class="form-control" required />
        </div>
        <button type="submit" class="btn btn-success">Actualizar</button>
        <a th:href="@{/administrador/proveedor}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
</body>
</html>
