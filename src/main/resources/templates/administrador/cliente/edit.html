<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="ISO-8859-1">
    <title>Editar Cliente</title>
    <link rel="stylesheet"
          href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
          integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
          crossorigin="anonymous">
</head>
<body>
<nav class="navbar navbar-expand-md bg-dark navbar-dark">
    <a class="navbar-brand" href="#">Sistema de Ventas</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#collapsibleNavbar">
        <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="collapsibleNavbar">
        <ul class="navbar-nav">
            <li class="nav-item"><a class="nav-link" th:href="@{/administrador/usuario}">Mantenedor Usuario</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/administrador/cliente}">Mantenedor Cliente</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/administrador/producto}">Mantenedor Producto</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/administrador/proveedor}">Mantenedor Proveedor</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/administrador/venta}">Mantenedor Venta</a></li>
        </ul>
    </div>
</nav>

<div class="container mt-3">
    <div class="row">
        <div class="col-lg-6 col-md-6 col-sm-6 container justify-content-center card">
            <h1 class="text-center">Editar Cliente</h1>
            <div class="card-body">
				<form th:action="@{/administrador/cliente/update/{id}(id=${cliente.idClie})}" th:object="${cliente}" method="POST">
                    <input type="hidden" th:field="*{idClie}" />

                    <div class="form-group">
                        <label>Razón Social</label>
                        <input type="text" th:field="*{razonSoc}" class="form-control" placeholder="Ingresar Razón Social" required />
                    </div>

                    <div class="form-group">
                        <label>Nombre</label>
                        <input type="text" th:field="*{nombre}" class="form-control" placeholder="Ingresar Nombre" required />
                    </div>

                    <div class="form-group">
                        <label>Dirección</label>
                        <input type="text" th:field="*{direccionClie}" class="form-control" placeholder="Ingresar Dirección" required />
                    </div>

                    <div class="form-group">
                        <label>Teléfono</label>
                        <input type="text" th:field="*{telefono}" class="form-control" placeholder="Ingresar Teléfono" required />
                    </div>

                    <div class="box-footer">
                        <button type="submit" class="btn btn-primary">Actualizar</button>
                        <a th:href="@{/administrador/cliente}" class="btn btn-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
