<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Ventas</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-expand-md bg-dark navbar-dark">
    <a class="navbar-brand">Ventas de Don pepe</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#nav">
        <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav">
            <li class="nav-item"><a class="nav-link" th:href="@{/administrador/usuario}">Administrar Usuario</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/administrador/cliente}">Mantener Cliente</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/administrador/producto}">Administrar Producto</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/administrador/proveedor}">Administrar Proveedor</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/administrador/venta}">Mantener Venta</a></li>
        </ul>
    </div>
</nav>

<div class="container mt-4">
    <h2>Lista de Ventas</h2>
    <a th:href="@{/administrador/venta/new}" class="btn btn-primary mb-3">Registrar Nueva Venta</a>
	<a th:href="@{/administrador/venta/generarPDF}" class="btn btn-primary mb-3">Generar Pdf</a>

    <table class="table table-bordered">
        <thead class="thead-dark">
            <tr>
                <th>ID</th>
                <th>Cliente</th>
                <th>Producto</th>
                <th>Proveedor</th>
                <th>Cantidad</th>
                <th>Stock Disponible</th>
				<th>Total</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="venta : ${ventas}">
               <td th:text="${venta.idventa}"></td>
                <td th:text="${venta.cliente.nombre}"></td> 
                 <td th:text="${venta.producto.descripcion}"></td>
              <td th:text="${venta.proveedor.nomprov}"></td>
              <td th:text="${venta.cantidad}"></td>
                <td th:text="${venta.producto.stock}"></td>
				<td th:text="${venta.total}"></td>
                <td>
                    <a th:href="@{/administrador/venta/edit/{id}(id=${venta.idventa})}" class="btn btn-warning btn-sm">Editar</a>
                    <a th:href="@{/administrador/venta/delete/{id}(id=${venta.idventa})}" class="btn btn-danger btn-sm" onclick="return confirm('¿Eliminar esta venta?')">Eliminar</a>
                </td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
