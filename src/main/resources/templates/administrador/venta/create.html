<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrar Venta</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-expand-md bg-dark navbar-dark">
    <a class="navbar-brand">Ventas de Don Pepe</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#nav">
        <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav">
            <li class="nav-item"><a class="nav-link" th:href="@{/administrador/usuario}">Administrar Usuario</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/administrador/cliente}">Mantener Cliente</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/administrador/producto}">Administrar Producto</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/administrador/proveedor}">Administrar Proveedor</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/administrador/venta}">Mantener Venta</a></li>
        </ul>
    </div>
</nav>

<div class="container mt-4">
    <h2>Registrar Nueva Venta</h2>
	<form th:action="@{/administrador/venta/guardar}" th:object="${venta}" method="post">
	     <div class="form-group">
	        <label>Cliente</label>
		<select th:field="*{cliente.idClie}" class="form-control" required>
	       <!--	    <option value="" disabled selected>-- Seleccione un cliente --</option>-->
				 <option th:each="c : ${clientes}" 
				        th:value="${c.idClie}" 
				        th:text="${c.dni}" 
				   th:selected="${venta.cliente != null and venta.cliente.idClie != null and venta.cliente.idClie == c.idClie}">
 				</option>

	        </select>
	    </div> 

	    <div class="form-group">
	        <label>Producto</label>
	          <select th:field="*{producto.idProd}" class="form-control" required>
	           <option value="" disabled selected>-- Seleccione un producto --</option>
	           <option th:each="p : ${productos}" th:value="${p.idProd}" th:text="${p.descripcion + ' (Stock: ' + p.stock + ')'}"></option>
	        </select>
	    </div> 

	   <div class="form-group">
	        <label>Proveedor</label>
	        <select th:field="*{proveedor.idprov}" class="form-control" required>
	          <!--  <option value="" disabled selected>-- Seleccione un proveedor --</option>-->
	             <option th:each="pr : ${proveedores}" th:value="${pr.idprov}" th:text="${pr.nomprov}"></option>
	        </select>
	    </div>	


	     <div class="form-group">
	       <label>Cantidad a Vender</label>
	       <input type="number" min="1" th:field="*{cantidad}" class="form-control" placeholder="Ingrese la cantidad" required>
	    </div> 

	    <button type="submit" class="btn btn-success">Guardar</button>
	    <a th:href="@{/administrador/venta}" class="btn btn-secondary">Cancelar</a>
	</form>
</div>
</body>
</html>
