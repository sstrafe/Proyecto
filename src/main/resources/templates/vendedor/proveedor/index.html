<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Proveedores</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
          integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
          crossorigin="anonymous">
</head>
<body>
<nav class="navbar navbar-expand-md bg-primary navbar-dark">
    <a class="navbar-brand">Ventas de Don Pepe</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#collapsibleNavbar">
        <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="collapsibleNavbar">
        <ul class="navbar-nav">
           
            <li class="nav-item">
                <a class="nav-link" th:href="@{/vendedor/cliente}">Mantener Cliente</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/vendedor/producto}">Consultar Producto</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/vendedor/proveedor}">Consultar Proveedor</a>
            </li>
			<li class="nav-item">
			                <a class="nav-link" th:href="@{/vendedor/venta}">Generar Reportes</a>
			 </li>
        </ul>
    </div>
</nav>

<div class="container mt-4">
    <h2>Proveedores</h2>
     <!-- <a class="btn btn-primary mb-2" th:href="@{/vendedor/proveedor/new}">Nuevo Proveedor</a> -->
    <table class="table table-striped table-bordered">
        <thead class="thead-dark">
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Teléfono</th>
            <th>Dirección</th>
          <!--  <th>Acciones</th>-->
        </tr>
        </thead>
        <tbody>
        <tr th:each="proveedor : ${proveedor}">
            <td th:text="${proveedor.idprov}"></td>
            <td th:text="${proveedor.nomprov}"></td>
            <td th:text="${proveedor.tfnprov}"></td>
            <td th:text="${proveedor.dirprov}"></td>
            <!--<td>
                <a class="btn btn-warning btn-sm"
                   th:href="@{/vendedor/proveedor/edit/{id}(id=${proveedor.idprov})}">Editar</a>
                <a class="btn btn-danger btn-sm"
                   th:href="@{/vendedor/proveedor/delete/{id}(id=${proveedor.idprov})}"
                   onclick="return confirm('¿Está seguro de eliminar?')">Eliminar</a>
            </td>-->
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
